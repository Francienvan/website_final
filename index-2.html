<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Francien van Everdingen - Interactive Artwork</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/artboard.css" />
</head>
<body>
  <main class="page-shell">
    <!-- DESKTOP ARTWORK -->
    <div class="artboard artboard--desktop" data-artboard="desktop">
      <div class="artboard__container">
        <img class="artboard__image" src="images/bg.jpg" alt="Desktop artwork - Francien van Everdingen" />
        
        <!-- Hotspots will be injected by JS -->
        <div class="hotspots-container"></div>
      </div>
    </div>

    <!-- MOBILE ARTWORK -->
    <div class="artboard artboard--mobile" data-artboard="mobile">
      <div class="artboard__container">
        <img class="artboard__image" src="images/mobile-bg.jpg" alt="Mobile artwork - Francien van Everdingen" />
        
        <!-- Hotspots will be injected by JS -->
        <div class="hotspots-container"></div>
      </div>
    </div>
  </main>

  <!-- MODAL FOR MEDIA -->
  <div class="modal fade modal-dark" id="mediaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-body p-0">
          <div id="videoContainer" class="ratio ratio-16x9 d-none">
            <iframe id="youtubeVideo" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          </div>
          <div id="pdfContainer" class="d-none"></div>
          <div id="imageContainer" class="d-none text-center p-2">
            <img id="modalImage" src="" alt="Preview" />
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/artboard.js"></script>
</body>
</html>
