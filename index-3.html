<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Francien van Everdingen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/artboard-2.css">
</head>
<body>
  <main>
    <div class="artboard artboard--desktop">
      <div class="artboard__container">
        <img src="images/bg.jpg" alt="Desktop artwork">
        <div class="hotspots-container"></div>
      </div>
    </div>
    <div class="artboard artboard--mobile">
      <div class="artboard__container">
        <img src="images/mobile-bg.jpg" alt="Mobile artwork">
        <div class="hotspots-container"></div>
      </div>
    </div>
  </main>
  <div class="modal fade" id="mediaModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content bg-dark text-white">
        <div class="modal-body p-0">
          <div id="videoContainer" class="ratio ratio-16x9 d-none">
            <iframe id="youtubeVideo" allowfullscreen></iframe>
          </div>
          <div id="pdfContainer" class="d-none"></div>
          <div id="imageContainer" class="d-none text-center p-2">
            <img id="modalImage" style="max-width:100%">
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2" data-bs-dismiss="modal"></button>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/artboard-2.js"></script>
</body>
</html>
