<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Francien van Everdingen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #989fa7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .artboard {
      display: none;
      min-height: 100vh;
    }

    .artboard--desktop.active,
    .artboard--mobile.active {
      display: block;
    }

    .artboard__container {
      position: relative;
      margin: 0 auto;
      width: 100%;
      max-width: 95%;
    }

    .artboard__image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .hotspots-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .hotspot {
      position: absolute;
      cursor: pointer;
      
    }

    .hotspot__dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: transform 0.2s;
      z-index: 10;
    }

    .hotspot:hover .hotspot__dot {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .hotspot__label {
      position: absolute;
      pointer-events: none;
      transform-origin: top left;
      z-index: 20;
    }

    .hotspot__label img {
      display: block;
      max-width: none;
    }

    #pdfContainer {
      max-height: 80vh;
      overflow-y: auto;
      background: #111;
      padding: 10px;
    }

    #pdfContainer canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 20px;
    }

    /* Prevent horizontal scroll caused by wide labels */
    body {
      overflow-x: hidden;
    }

    .artboard__container {
      overflow-x: hidden;
    }

    @media (max-width: 640px) {
      .artboard--desktop.active {
        display: none;
      }
      .artboard--mobile.active {
        display: block;
      }
    }

    @media (min-width: 641px) {
      .artboard--desktop.active {
        display: block;
      }
      .artboard--mobile.active {
        display: none;
      }
    }
  </style>
</head>

    <!-- Desktop artwork (used for screens wider than 640px) -->
    <div class="artboard artboard--desktop">

        <img class="artboard__image" src="images/bg.jpg" alt="Desktop artwork">
        <div class="hotspots-container"></div>
      </div>
    </div>

    <!-- Mobile artwork (used for screens up to 640px) -->
    <div class="artboard artboard--mobile">
      <div class="artboard__container">
        <img class="artboard__image" src="images/mobile-bg.jpg" alt="Mobile artwork">
        <div class="hotspots-container"></div>

    </div>
  </main>

    // Helper to get the configuration that best matches the current screen width
    function getConfigForWidth(width) {
      var breakpoints = [320, 375, 390, 428, 480, 667, 768, 800, 844, 926, 1024, 1280, 1366, 1920, 2560, 3840];
      breakpoints.sort(function(a, b) { return a - b; });
      var closest = breakpoints[0];
      for (var i = 0; i < breakpoints.length; i++) {
        if (width <= breakpoints[i]) {
          closest = breakpoints[i];
          break;
        }
        closest = breakpoints[i];
      }
      return breakpointConfigs[closest] || breakpointConfigs[1920];
    }

    // Create the hotspot element from its configuration
    function createHotspot(c) {
      var a = document.createElement("a");
      a.className = "hotspot";
      a.style.left = c.x + "%";
      a.style.top = c.y + "%";

      var d = document.createElement("div");
      d.className = "hotspot__dot";
      d.style.backgroundImage = "url('images/" + c.dotImage + "')";
      d.style.width = c.dotSize + "px";
      d.style.height = c.dotSize + "px";
      //d.style.marginLeft = -(c.dotSize / 2) + "px";
      //d.style.marginTop = -(c.dotSize / 2) + "px";
      a.appendChild(d);

      if (c.type !== "area" && c.labelImage) {
        var l = document.createElement("div");
        l.className = "hotspot__label";
        var i = document.createElement("img");
        i.src = c.labelImage;
        i.alt = c.name;
        l.appendChild(i);
        l.style.left = (c.labelX || 0) + "px";
        l.style.top = (c.labelY || 0) + "px";
        l.style.transform = "scale(" + (c.labelScale || 1) + ")";
        a.appendChild(l);
      }

      if (c.type === "external") {
        a.href = c.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      } else if (c.type === "exit") {
        a.href = "#";
        a.onclick = function(e) { e.preventDefault(); window.close(); return false; };
      } else if (c.type !== "area") {
        a.href = "#";
        a.setAttribute("data-bs-toggle", "modal");
        a.setAttribute("data-bs-target", "#mediaModal");
        a.setAttribute("data-type", c.type);
        a.setAttribute("data-src", c.url);
      }
      return a;
    }

    // Render hotspots for the given artboard (desktop or mobile)
    function renderArtboard(type) {
      var artboard = document.querySelector(".artboard--" + type);
      if (!artboard) return;
      var container = artboard.querySelector(".hotspots-container");
      if (!container) return;
      var width = window.innerWidth;
      var configs = getConfigForWidth(width);
      container.innerHTML = "";
      for (var i = 0; i < configs.length; i++) {
        container.appendChild(createHotspot(configs[i]));
      }
    }

    // PDF rendering (used inside the modal)
    async function renderPDF(url) {
      var pdfContainer = document.getElementById("pdfContainer");
      pdfContainer.innerHTML = '<div class="text-center p-4 text-white">Loading PDF...</div>';
      try {
        var response = await fetch(url);
        var arrayBuffer = await response.arrayBuffer();
        var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        pdfContainer.innerHTML = "";
        for (var i = 1; i <= pdf.numPages; i++) {
          var page = await pdf.getPage(i);
          var viewport = page.getViewport({ scale: 1.5 });
          var canvas = document.createElement("canvas");
          var ctx = canvas.getContext("2d");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = "100%";
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          pdfContainer.appendChild(canvas);
        }
      } catch (err) {
        pdfContainer.innerHTML = '<div class="alert alert-danger m-3">Error loading PDF. Please try again later.</div>';
      }
    }

    // Activate the correct artboard based on screen width
    function setActiveArtboard() {
      var width = window.innerWidth;
      var isMobile = width <= 640;
      var desktopArtboard = document.querySelector(".artboard--desktop");
      var mobileArtboard = document.querySelector(".artboard--mobile");
      if (desktopArtboard && mobileArtboard) {
        desktopArtboard.classList.toggle("active", !isMobile);
        mobileArtboard.classList.toggle("active", isMobile);
      }
    }

    // Initialisation
    document.addEventListener("DOMContentLoaded", function() {
      renderArtboard("desktop");
      renderArtboard("mobile");
      setActiveArtboard();
      window.addEventListener("resize", function() {
        setActiveArtboard();
        renderArtboard("desktop");
        renderArtboard("mobile");
      });
    });

    // Modal logic
    var modalElement = document.getElementById("mediaModal");
    if (modalElement) {
      modalElement.addEventListener("show.bs.modal", async function(event) {
        var trigger = event.relatedTarget;
        var type = trigger?.getAttribute("data-type");
        var src = trigger?.getAttribute("data-src");

        var videoContainer = document.getElementById("videoContainer");
        var pdfContainer = document.getElementById("pdfContainer");
        var imageContainer = document.getElementById("imageContainer");

        videoContainer.classList.add("d-none");
        pdfContainer.classList.add("d-none");
        imageContainer.classList.add("d-none");

        if (type === "video" && src) {
          videoContainer.classList.remove("d-none");
          var youtubeIframe = document.getElementById("youtubeVideo");
          var separator = src.includes("?") ? "&" : "?";
          youtubeIframe.src = src + separator + "autoplay=1&rel=0";
        } else if (type === "pdf" && src) {
          pdfContainer.classList.remove("d-none");
          await renderPDF(src);
        } else if (type === "image" && src) {
          imageContainer.classList.remove("d-none");
          document.getElementById("modalImage").src = src;
        }
      });

      modalElement.addEventListener("hidden.bs.modal", function() {
        var youtubeIframe = document.getElementById("youtubeVideo");
        if (youtubeIframe) youtubeIframe.src = "";
        document.getElementById("pdfContainer").innerHTML = "";
        document.getElementById("modalImage").src = "";
      });
    }
  </script>
</body>
</html>
